<!DOCTYPE html>
<html>
<head>
  <title>Carwah Instinto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      color: gold;
      background: black;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1607860108855-64acf2078ed9') center/cover no-repeat;
      opacity: 0.15;
    }

    .container {
      position: relative;
      padding: 15px;
    }

    .card {
      background: rgba(0,0,0,0.8);
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      max-width: 320px;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }

    button, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: linear-gradient(45deg, gold, orange);
      font-weight: bold;
      cursor: pointer;
    }

    .disabled {
      background: gray !important;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="container">

<h2>Carwah Instinto 🚗</h2>

<!-- 📅 FECHA -->
<div class="card">
  <h3>Selecciona el día</h3>
  <button onclick="setFecha(0)" id="hoyBtn"></button>
  <button onclick="setFecha(1)" id="mananaBtn"></button>
</div>

<!-- 🚗 SERVICIO -->
<div class="card">
  <h3>Servicio</h3>
  <select id="servicio">
    <option>Lavado Express</option>
    <option>Lavado Premium</option>
  </select>
</div>

<!-- ⏰ HORA -->
<div class="card">
  <h3>Hora disponible</h3>
  <select id="hora"></select>
</div>

<!-- 📲 BOTÓN -->
<div class="card">
  <button onclick="reservar()">Agendar cita</button>
</div>

</div>

<script>
  let fechaSeleccionada = "";
  let citas = JSON.parse(localStorage.getItem("citas")) || [];

  let horasBase = [
    "9:00 AM","10:00 AM","11:00 AM",
    "1:00 PM","2:00 PM","3:00 PM"
  ];

  function generarFechas() {
    let hoy = new Date();
    let manana = new Date();
    manana.setDate(hoy.getDate() + 1);

    document.getElementById("hoyBtn").innerText =
      "Hoy (" + hoy.toLocaleDateString('es-DO') + ")";

    document.getElementById("mananaBtn").innerText =
      "Mañana (" + manana.toLocaleDateString('es-DO') + ")";
  }

  function setFecha(dias) {
    let fecha = new Date();
    fecha.setDate(fecha.getDate() + dias);
    fechaSeleccionada = fecha.toISOString().split("T")[0];

    actualizarHoras();
  }

  function actualizarHoras() {
    let select = document.getElementById("hora");
    select.innerHTML = "";

    horasBase.forEach(hora => {
      let clave = fechaSeleccionada + "-" + hora;

      if (!citas.includes(clave)) {
        let option = document.createElement("option");
        option.text = hora;
        select.add(option);
      }
    });

    if (select.options.length === 0) {
      let option = document.createElement("option");
      option.text = "No hay horarios disponibles";
      select.add(option);
    }
  }

  function reservar() {
    let servicio = document.getElementById("servicio").value;
    let hora = document.getElementById("hora").value;

    if (!fechaSeleccionada) {
      alert("Selecciona una fecha");
      return;
    }

    if (hora === "No hay horarios disponibles") {
      alert("Ese día está lleno");
      return;
    }

    let clave = fechaSeleccionada + "-" + hora;

    citas.push(clave);
    localStorage.setItem("citas", JSON.stringify(citas));

    let mensaje = "Hola, quiero agendar:\n" +
      "Servicio: " + servicio + "\n" +
      "Fecha: " + fechaSeleccionada + "\n" +
      "Hora: " + hora;

    let url = "https://wa.me/18094385474?text=" + encodeURIComponent(mensaje);
    window.open(url, "_blank");

    actualizarHoras();
  }

  generarFechas();
</script>

</body>
</html>
