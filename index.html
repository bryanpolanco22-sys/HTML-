<!DOCTYPE html>
<html>
<head>
  <title>Carwah Instinto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      color: gold;
      background: black;
      text-align: center;
    }

    /* 🚗 FONDO */
    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1607860108855-64acf2078ed9') center/cover no-repeat;
      opacity: 0.15;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 15px;
    }

    .card {
      background: rgba(0,0,0,0.8);
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      max-width: 330px;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
    }

    button, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: linear-gradient(45deg, gold, orange);
      font-weight: bold;
      cursor: pointer;
    }

    h2 {
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">

<h2>Carwah Instinto 🚗✨</h2>

<!-- 🚗 SERVICIOS -->
<div class="card">
  <h3>Lavado Express</h3>
  <ul style="text-align:left;">
    <li>Lavado exterior</li>
    <li>Secado rápido</li>
    <li>Brillo de gomas</li>
  </ul>
  <p>RD$ 500</p>
  <button onclick="seleccionarServicio('Lavado Express')">Elegir este servicio</button>
</div>

<div class="card">
  <h3>Lavado Premium</h3>
  <ul style="text-align:left;">
    <li>Lavado completo</li>
    <li>Limpieza interior</li>
    <li>Aspirado profundo</li>
    <li>Cera protectora</li>
  </ul>
  <p>RD$ 1,200</p>
  <button onclick="seleccionarServicio('Lavado Premium')">Elegir este servicio</button>
</div>

<!-- 📅 AGENDA -->
<div class="card">
  <h3>Agendar cita</h3>

  <p id="servicioSeleccionado">Servicio: Ninguno</p>

  <button onclick="setFecha(0)" id="hoyBtn"></button>
  <button onclick="setFecha(1)" id="mananaBtn"></button>

  <select id="hora"></select>

  <button onclick="reservar()">Confirmar cita</button>
</div>

</div>

<script>
  let servicio = "";
  let fechaSeleccionada = "";
  let citas = JSON.parse(localStorage.getItem("citas")) || [];

  let horasBase = [
    "9:00 AM","10:00 AM","11:00 AM",
    "1:00 PM","2:00 PM","3:00 PM"
  ];

  function seleccionarServicio(s) {
    servicio = s;
    document.getElementById("servicioSeleccionado").innerText = "Servicio: " + s;
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function generarFechas() {
    let hoy = new Date();
    let manana = new Date();
    manana.setDate(hoy.getDate() + 1);

    document.getElementById("hoyBtn").innerText =
      "Hoy (" + hoy.toLocaleDateString('es-DO') + ")";

    document.getElementById("mananaBtn").innerText =
      "Mañana (" + manana.toLocaleDateString('es-DO') + ")";
  }

  function setFecha(dias) {
    let fecha = new Date();
    fecha.setDate(fecha.getDate() + dias);
    fechaSeleccionada = fecha.toISOString().split("T")[0];
    actualizarHoras();
  }

  function actualizarHoras() {
    let select = document.getElementById("hora");
    select.innerHTML = "";

    horasBase.forEach(hora => {
      let clave = fechaSeleccionada + "-" + hora;

      if (!citas.includes(clave)) {
        let option = document.createElement("option");
        option.text = hora;
        select.add(option);
      }
    });

    if (select.options.length === 0) {
      let option = document.createElement("option");
      option.text = "No disponible";
      select.add(option);
    }
  }

  function reservar() {
    let hora = document.getElementById("hora").value;

    if (!servicio) {
      alert("Selecciona un servicio primero");
      return;
    }

    if (!fechaSeleccionada) {
      alert("Selecciona una fecha");
      return;
    }

    if (hora === "No disponible") {
      alert("Ese día está lleno");
      return;
    }

    let clave = fechaSeleccionada + "-" + hora;
    citas.push(clave);
    localStorage.setItem("citas", JSON.stringify(citas));

    let mensaje = "Hola, quiero agendar:\n" +
      "Servicio: " + servicio + "\n" +
      "Fecha: " + fechaSeleccionada + "\n" +
      "Hora: " + hora;

    let url = "https://wa.me/18094385474?text=" + encodeURIComponent(mensaje);
    window.open(url, "_blank");

    actualizarHoras();
  }

  generarFechas();
</script>

</body>
</html>
